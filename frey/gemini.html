<!doctype html>
<html lang="ru" class="dark">
<head>
  <meta charset="utf-8" />
  <title>V2k Decompiler — v5.0 Mixer Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgo=" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: { slate: { 850: '#152033', 900: '#0f172a' } },
          animation: { 'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
        }
      }
    }
  </script>
  <style>
    body, html { height: 100%; overflow: hidden; background-color: #0f172a; color: #e2e8f0; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.1); }
    #sidebar { transition: width 0.3s ease; width: 420px; min-width: 420px; }
    #sidebar.collapsed { width: 0; min-width: 0; padding: 0; opacity: 0; border: none; }
    .tab-btn.active { background-color: #3b82f6; color: white; }
    .tab-content { display: none; } .tab-content.active { display: block; }
    
    /* Range Slider Styling */
    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -5px; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 2px; background: #475569; border-radius: 2px; }
    
    [data-tooltip]:hover::after { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 4px 8px; font-size: 10px; border-radius: 4px; border: 1px solid #475569; opacity: 1; z-index: 50; }
    .section-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  </style>
</head>
<body class="flex flex-col h-screen text-slate-300 font-sans selection:bg-blue-500/30">

  <audio id="streamPlayer" crossorigin="anonymous" style="display:none;"></audio>

  <!-- Header -->
  <header class="h-14 glass-panel border-b border-slate-700/50 flex items-center justify-between px-4 shrink-0 z-20 relative">
    <div class="flex items-center gap-4">
      <button id="btnToggleSidebar" class="p-2 text-slate-400 hover:text-white"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM9 3v18M15 9l3 3-3 3"/></svg></button>
      <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">V2k Demodulator v5.0</h1>
    </div>
    <div id="liveIndicator" class="hidden absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 flex items-center gap-2 bg-red-500/10 border border-red-500/30 px-3 py-1 rounded-full">
      <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse-fast"></span><span class="text-[10px] font-bold text-red-400">LIVE AI ANALYSIS</span>
    </div>
  </header>

  <!-- Progress -->
  <div id="progress" class="hidden absolute top-14 left-0 w-full z-30 bg-slate-900/95 border-b border-blue-900/50"><div class="h-1 bg-blue-500 w-0" id="progressFill"></div></div>

  <main class="flex-1 flex overflow-hidden relative">
    
    <!-- SIDEBAR -->
    <aside id="sidebar" class="flex flex-col gap-3 p-3 overflow-y-auto border-r border-slate-700/30 bg-slate-900/50 pb-20">
      
      <!-- 1. SOURCES -->
      <div class="glass-panel rounded-lg p-3 shrink-0">
        <h3 class="text-xs font-semibold text-slate-200 mb-3"><span class="section-dot bg-blue-500"></span>Источники</h3>
        <div class="flex gap-1 mb-3 bg-slate-950/50 p-1 rounded">
          <button onclick="switchTab('tab-file')" id="btn-tab-file" class="tab-btn active flex-1 py-1 text-[10px] rounded">Files</button>
          <button onclick="switchTab('tab-radio')" id="btn-tab-radio" class="tab-btn flex-1 py-1 text-[10px] rounded">Radio</button>
          <button onclick="switchTab('tab-mic')" id="btn-tab-mic" class="tab-btn flex-1 py-1 text-[10px] rounded">Mic</button>
        </div>
        
        <!-- Files Tab -->
        <div id="tab-file" class="tab-content active space-y-2">
           <div class="flex gap-2"><button id="btnLoadDemo" class="flex-1 bg-slate-800 border border-slate-700 rounded py-1 text-[10px]">Demo</button><input id="fileInput" type="file" multiple class="flex-1 text-[10px]"></div>
           <select id="sampleSelect" class="w-full bg-slate-900 border border-slate-700 rounded py-1 px-2 text-[10px]"></select>
           <div class="flex gap-2"><button id="btnPlay" class="flex-1 bg-emerald-600 text-white py-1 rounded text-[10px]">▶ Play</button><button id="btnStop" class="px-3 bg-slate-700 rounded text-[10px]">⏹</button></div>
        </div>

        <!-- Radio Tab -->
        <div id="tab-radio" class="tab-content space-y-2">
          <input id="streamUrl" type="text" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-[10px]" placeholder="http://stream...">
          <button id="btnStreamConnect" class="w-full bg-green-600 text-white py-1 rounded text-[10px]">▶ Connect Stream</button>
        </div>

        <!-- Mic Tab -->
        <div id="tab-mic" class="tab-content space-y-2">
          <select id="micSelect" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-[10px]"></select>
          <button id="btnMicStart" class="w-full bg-red-600 text-white py-1 rounded text-[10px]">● Start Capture</button>
        </div>
      </div>

      <!-- 2. MIXER & EQ (NEW) -->
      <div class="glass-panel rounded-lg p-3 shrink-0">
        <div class="flex justify-between items-center mb-2">
            <h3 class="text-xs font-semibold text-slate-200"><span class="section-dot bg-pink-500"></span>Mixer & EQ</h3>
            <button id="btnResetEQ" class="text-[9px] text-slate-500 hover:text-white">Reset</button>
        </div>

        <!-- Volume -->
        <div class="mb-3">
          <div class="flex justify-between text-[10px] text-slate-400 mb-1"><span>Gain</span><span id="val-gain">1.0</span></div>
          <input type="range" id="mix-gain" min="0" max="3" step="0.1" value="1" class="w-full">
        </div>

        <!-- 3-Band EQ -->
        <div class="grid grid-cols-3 gap-2 text-center">
            <div>
                <label class="block text-[9px] text-slate-500 mb-1">Low</label>
                <div class="h-24 relative bg-slate-950/50 rounded border border-slate-800 flex justify-center py-2">
                    <input type="range" id="eq-low" min="-15" max="15" value="0" step="1" class="absolute h-20 w-1" style="-webkit-appearance: slider-vertical; width: 6px;">
                </div>
                <span id="val-low" class="text-[9px] text-slate-400 block mt-1">0dB</span>
            </div>
            <div>
                <label class="block text-[9px] text-slate-500 mb-1">Mid</label>
                <div class="h-24 relative bg-slate-950/50 rounded border border-slate-800 flex justify-center py-2">
                    <input type="range" id="eq-mid" min="-15" max="15" value="0" step="1" class="absolute h-20 w-1" style="-webkit-appearance: slider-vertical; width: 6px;">
                </div>
                 <span id="val-mid" class="text-[9px] text-slate-400 block mt-1">0dB</span>
            </div>
            <div>
                <label class="block text-[9px] text-slate-500 mb-1">High</label>
                <div class="h-24 relative bg-slate-950/50 rounded border border-slate-800 flex justify-center py-2">
                    <input type="range" id="eq-high" min="-15" max="15" value="0" step="1" class="absolute h-20 w-1" style="-webkit-appearance: slider-vertical; width: 6px;">
                </div>
                 <span id="val-high" class="text-[9px] text-slate-400 block mt-1">0dB</span>
            </div>
        </div>
      </div>

      <!-- 3. DSP Settings -->
      <div class="glass-panel rounded-lg p-3 shrink-0">
        <h3 class="text-xs font-semibold text-slate-200 mb-2"><span class="section-dot bg-violet-500"></span>DSP</h3>
        <div class="grid grid-cols-2 gap-2 mb-2">
           <div><label class="text-[9px] text-slate-500">Env Rate</label><input id="env_sr" type="number" value="120" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-[10px]"></div>
           <div class="flex gap-1 pt-4">
             <input type="checkbox" id="use_rms" checked title="RMS"><input type="checkbox" id="use_centroid" checked title="Centroid"><input type="checkbox" id="use_hilbert" checked title="Hilbert">
           </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="btnExtract" class="bg-slate-700 text-white py-1 rounded text-[10px]">Extract</button>
          <button id="btnCluster" class="bg-indigo-600 text-white py-1 rounded text-[10px]">Cluster</button>
        </div>
        <!-- Hidden Advanced Settings needed for JS -->
        <div class="hidden">
           <input id="pp_dc" type="checkbox" checked><input id="pp_pre" type="checkbox" checked>
           <input id="pp_hp" value="80"><input id="pp_lp" value="4000">
           <input id="pp_gate" type="checkbox" checked><input id="pp_gate_init" value="12"><input id="pp_gate_mul" value="1.8"><input id="pp_gate_red" value="18">
           <input id="pp_vad" type="checkbox" checked><input id="pp_vad_q" value="0.25"><input id="pp_vad_cf" value="250">
           <input id="dtw_len" value="96"><input id="topk" value="10"><input id="dtw_band" value="15"><input id="use_znorm" type="checkbox" checked>
           <input id="maxClusters" value="5"><select id="clusterMethod"><option value="elbow">Elbow</option></select>
           <input id="openaiKey"><textarea id="gptContext"></textarea>
           <button id="btnInterpretClusters"></button><button id="btnVisualizeClusters"></button><button id="btnExport"></button><button id="btnExtractAll"></button><button id="btnMatch"></button><button id="btnStreamStop"></button>
        </div>
      </div>
    </aside>

    <!-- VISUALIZATION AREA -->
    <section class="flex-1 flex flex-col bg-slate-900/30 overflow-hidden">
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
             <!-- Graphs -->
             <div class="glass-panel rounded p-1"><canvas id="waveCanvas" width="900" height="120" class="w-full h-auto bg-slate-950 rounded border border-slate-800"></canvas></div>
             <div class="glass-panel rounded p-1"><canvas id="envCanvas" width="900" height="160" class="w-full h-auto bg-slate-950 rounded border border-slate-800"></canvas></div>
             <div class="glass-panel rounded p-1 flex justify-center"><canvas id="dtwCanvas" width="900" height="200" class="h-[200px] w-auto bg-slate-950 rounded border border-slate-800"></canvas></div>
             <!-- Logs -->
             <div class="glass-panel rounded p-3 min-h-[100px]">
                <pre id="results" class="font-mono text-[10px] text-slate-400">Ready.</pre>
                <div id="log" class="text-[9px] text-slate-600 border-t border-slate-800 pt-1 mt-2">Log...</div>
                <div id="clusterResults"></div><div id="clusterDetails"></div><div id="decodeHTML"></div>
             </div>
        </div>
    </section>

  </main>
  
  <script>
    function switchTab(id){
        document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('btn-'+id).classList.add('active');
        document.getElementById('btnToggleSidebar').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('collapsed'));
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
