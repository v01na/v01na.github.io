<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>DEBUG: FREY DEMODULATOR | GOOGLE 2026</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --err: #ff003c; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; padding: 10px; margin: 0; }
        
        .header { border-bottom: 2px solid var(--neon); padding: 10px; text-align: center; }
        .main-panel { border: 1px solid #333; background: #111; padding: 15px; margin-top: 10px; border-radius: 5px; }
        
        /* Сетка отладки */
        .debug-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.7rem; margin-bottom: 10px; }
        .debug-item { border: 1px solid #222; padding: 5px; background: #000; }
        .debug-label { color: #888; }
        
        .canvas-box { position: relative; background: #000; border: 1px solid var(--neon); margin: 10px 0; }
        canvas { width: 100%; height: 120px; display: block; }

        .btn { background: var(--neon); color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 5px; }
        .btn:disabled { background: #222; color: #555; cursor: not-allowed; }

        #console-log { height: 150px; overflow-y: auto; background: #000; color: #888; font-size: 0.7rem; padding: 10px; border: 1px dashed #333; line-height: 1.2; }
        .log-warn { color: #ffaa00; }
        .log-err { color: var(--err); font-weight: bold; }
        .log-success { color: var(--neon); }

        .file-input-wrapper { margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header">
    <strong>DEMODULATOR DEBUG MODE v2026.4</strong><br>
    <small>Engine: Google Bio-RF Neural Extractor</small>
</div>

<div class="main-panel">
    <div class="debug-grid">
        <div class="debug-item"><span class="debug-label">Ctx State:</span> <span id="ctx-state">OFF</span></div>
        <div class="debug-item"><span class="debug-label">Sample Rate:</span> <span id="s-rate">0</span></div>
        <div class="debug-item"><span class="debug-label">RMS Energy:</span> <span id="rms-val">0.000</span></div>
        <div class="debug-item"><span class="debug-label">Buf Length:</span> <span id="buf-len">0</span></div>
    </div>

    <div class="file-input-wrapper">
        <input type="file" id="fileInput" accept="audio/*" style="display:none">
        <button class="btn" onclick="document.getElementById('fileInput').click()">1. ВЫБРАТЬ ФАЙЛ</button>
    </div>
    
    <button class="btn" id="analyzeBtn" disabled>2. ЗАПУСТИТЬ ДЕМОДУЛЯЦИЮ</button>

    <div class="canvas-box">
        <canvas id="scope"></canvas>
    </div>

    <div id="console-log"></div>
</div>

<script>
    const logEl = document.getElementById('console-log');
    const ctxStateEl = document.getElementById('ctx-state');
    const sRateEl = document.getElementById('s-rate');
    const rmsEl = document.getElementById('rms-val');
    const bufLenEl = document.getElementById('buf-len');
    const fileInput = document.getElementById('fileInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const canvas = document.getElementById('scope');
    const ctxCanvas = canvas.getContext('2d');

    let audioCtx, analyser, dataArray, animationId;

    function pushLog(msg, type = '') {
        const div = document.createElement('div');
        div.className = type;
        div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.prepend(div);
        console.log(msg);
    }

    // Решение проблемы 2026: Принудительный старт контекста
    async function unlockAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sRateEl.innerText = audioCtx.sampleRate + "Hz";
        }
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }
        ctxStateEl.innerText = audioCtx.state.toUpperCase();
        ctxStateEl.style.color = "var(--neon)";
    }

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            pushLog(`Файл выбран: ${file.name} (${(file.size/1024).toFixed(1)} KB)`, 'log-success');
            analyzeBtn.disabled = false;
        }
    };

    analyzeBtn.onclick = async () => {
        try {
            pushLog("Инициализация Bio-RF Engine...");
            await unlockAudio();

            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            pushLog("ArrayBuffer загружен в память.");

            pushLog("Декодирование аудиоданных...");
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            bufLenEl.innerText = audioBuffer.length + " samples";
            pushLog(`Декодировано: ${audioBuffer.duration.toFixed(2)} сек.`, 'log-success');

            // Построение цепи демодуляции
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;

            // Демодулятор Фрея: Огибающая извлекается через прослушивание импульсов
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            source.start(0);
            pushLog("Воспроизведение и анализ огибающей...");
            
            startVisualization();

            source.onended = () => {
                pushLog("Обработка завершена.", 'log-warn');
                cancelAnimationFrame(animationId);
            };

        } catch (err) {
            pushLog(`КРИТИЧЕСКАЯ ОШИБКА: ${err.message}`, 'log-err');
        }
    };

    function startVisualization() {
        dataArray = new Float32Array(analyser.frequencyBinCount);
        
        function draw() {
            animationId = requestAnimationFrame(draw);
            analyser.getFloatTimeDomainData(dataArray);

            // Расчет RMS (телеметрия)
            let sum = 0;
            for(let i=0; i<dataArray.length; i++) sum += dataArray[i]*dataArray[i];
            let rms = Math.sqrt(sum/dataArray.length);
            rmsEl.innerText = rms.toFixed(4);

            // Отрисовка
            ctxCanvas.fillStyle = '#000';
            ctxCanvas.fillRect(0, 0, canvas.width, canvas.height);
            ctxCanvas.strokeStyle = 'var(--neon)';
            ctxCanvas.lineWidth = 1;
            ctxCanvas.beginPath();

            let sliceWidth = canvas.width / dataArray.length;
            let x = 0;
            for(let i=0; i<dataArray.length; i++) {
                let v = (dataArray[i] * 0.5 + 0.5) * canvas.height;
                if(i === 0) ctxCanvas.moveTo(x, v); else ctxCanvas.lineTo(x, v);
                x += sliceWidth;
            }
            ctxCanvas.stroke();
        }
        draw();
    }
</script>
</body>
</html>
