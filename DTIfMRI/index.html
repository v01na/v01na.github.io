<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Forensic DTI Analyzer (Niivue)</title>
    
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* Custom Variables for Forensic Palette */
        :root {
            --color-neon-cyan: #00f3ff;
            --color-neon-purple: #bc13fe;
            --color-neon-orange: #ff9100;
            --color-alert-red: #ff2a2a;
            --bg-glass: rgba(16, 24, 45, 0.65);
            --border-glass: rgba(100, 200, 255, 0.15);
        }

        body {
            background-color: #05070a;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(188, 19, 254, 0.05) 0%, transparent 40%);
            color: #e0f2fe;
            height: 100vh;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
        }

        .font-mono { font-family: 'Share Tech Mono', monospace; }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-header {
            background: linear-gradient(180deg, rgba(16, 24, 45, 0.9) 0%, rgba(16, 24, 45, 0.5) 100%);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
        }

        /* Animations */
        @keyframes scanline {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scan-effect::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--color-neon-cyan);
            box-shadow: 0 0 10px var(--color-neon-cyan);
            animation: scanline 4s linear infinite;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes equalize {
            0% { height: 20%; }
            50% { height: 90%; }
            100% { height: 20%; }
        }
        .bar { animation: equalize 2s infinite ease-in-out; }

        /* Niivue Canvas Reset */
        canvas#gl {
            width: 100% !important;
            height: 100% !important;
            outline: none;
            cursor: crosshair;
        }
    </style>
</head>
<body class="flex flex-col antialiased selection:bg-[#00f3ff] selection:text-black">

    <!-- Header -->
    <header class="h-16 glass-header flex items-center justify-between px-6 z-50 shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-full border border-[#00f3ff] flex items-center justify-center bg-cyan-900/30 shadow-[0_0_15px_rgba(0,243,255,0.4)]">
                <svg class="w-5 h-5 text-[#00f3ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <h1 class="text-xl tracking-wider font-bold text-white uppercase drop-shadow-[0_0_5px_rgba(0,243,255,0.8)]">
                Neuro-Forensic <span class="text-[#00f3ff]">DTI Analyzer</span>
            </h1>
            <span class="px-2 py-0.5 text-xs bg-[#bc13fe]/20 border border-[#bc13fe]/50 rounded text-[#bc13fe] font-mono">v 4.2.0 Niivue</span>
        </div>

        <div class="flex items-center gap-6 text-sm font-mono text-cyan-100/70">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[#ff2a2a] animate-pulse"></span>
                <span>CASE ID: #FR-2024-X99</span>
            </div>
            <div class="flex gap-3">
                <button class="px-4 py-1.5 rounded-full border border-cyan-500/30 bg-cyan-500/10 hover:bg-cyan-500/20 transition text-cyan-300 backdrop-blur-sm cursor-pointer">
                    Load DICOM
                </button>
                <button class="px-4 py-1.5 rounded-full bg-[#00f3ff] text-black font-bold shadow-[0_0_15px_rgba(0,243,255,0.4)] hover:brightness-110 transition cursor-pointer">
                    Export Evidence
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex p-4 gap-4 overflow-hidden relative z-10">
        
        <!-- Left Sidebar: Controls -->
        <aside class="w-[280px] flex flex-col gap-4 shrink-0">
            
            <!-- Signal Correlation -->
            <div class="glass-panel rounded-2xl p-5 flex-1 flex flex-col relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-cyan-900/10 pointer-events-none"></div>
                
                <h2 class="text-[#00f3ff] font-bold mb-4 flex justify-between items-center text-xs uppercase tracking-widest border-b border-white/10 pb-2">
                    <span>Signal Sync</span>
                    <span class="text-[#ff9100] animate-pulse">● LIVE</span>
                </h2>

                <!-- Visualizer -->
                <div class="relative h-32 bg-black/40 rounded-lg border border-white/10 mb-4 overflow-hidden flex items-end justify-between px-2 pb-1">
                    <div class="w-1 bg-[#bc13fe] bar" style="animation-duration: 0.8s"></div>
                    <div class="w-1 bg-[#bc13fe] bar" style="animation-duration: 1.2s"></div>
                    <div class="w-1 bg-[#00f3ff] bar" style="animation-duration: 0.5s"></div>
                    <div class="w-1 bg-[#00f3ff] bar" style="animation-duration: 1.5s"></div>
                    <div class="w-1 bg-[#ff9100] h-full shadow-[0_0_8px_#ff9100]"></div> <!-- Trigger -->
                    <div class="w-1 bg-[#00f3ff] bar" style="animation-duration: 0.9s"></div>
                    <div class="w-1 bg-[#bc13fe] bar" style="animation-duration: 1.1s"></div>
                </div>

                <div class="space-y-3 font-mono text-[10px]">
                    <div class="flex justify-between p-2 rounded bg-white/5 border border-white/5">
                        <span class="text-gray-400">Freq Offset:</span>
                        <span class="text-[#00f3ff]">-0.02ms</span>
                    </div>
                    <div class="flex justify-between p-2 rounded bg-orange-900/20 border border-[#ff9100]/30">
                        <span class="text-gray-400">Correlation:</span>
                        <span class="text-[#ff9100] font-bold">99.8%</span>
                    </div>
                </div>
            </div>

            <!-- View Controls -->
            <div class="glass-panel rounded-2xl p-5 h-1/3 flex flex-col justify-between">
                <h2 class="text-gray-300 font-bold text-xs uppercase tracking-widest">Render Options</h2>
                
                <div class="space-y-4 font-mono text-xs">
                    <div>
                        <label class="flex justify-between text-cyan-200 mb-1">Opacity</label>
                        <input type="range" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-[#00f3ff]">
                    </div>
                    <div class="flex flex-col gap-2">
                        <button class="w-full py-2 border border-[#00f3ff]/30 text-[#00f3ff] bg-[#00f3ff]/5 hover:bg-[#00f3ff]/10 rounded transition">Reset View</button>
                        <button class="w-full py-2 border border-[#ff2a2a]/30 text-[#ff2a2a] bg-[#ff2a2a]/5 hover:bg-[#ff2a2a]/10 rounded transition">Show Lesions</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center: Niivue Viewport -->
        <section class="flex-1 glass-panel rounded-2xl relative overflow-hidden flex flex-col scan-effect p-1 bg-black/50">
            <!-- Canvas Container -->
            <div class="w-full h-full rounded-xl overflow-hidden relative bg-black">
                
                <!-- Overlay UI inside Viewer -->
                <div class="absolute top-4 left-4 z-20 pointer-events-none">
                    <div class="text-[#00f3ff] text-xs font-mono border-l-2 border-[#00f3ff] pl-2 bg-black/40 backdrop-blur p-1">
                        <div>SERIES: MNI-152-REF</div>
                        <div>VOXEL: 1mm ISOTROPIC</div>
                    </div>
                </div>

                <div class="absolute bottom-4 right-4 z-20 pointer-events-none text-right">
                    <div class="text-[#bc13fe] text-[10px] font-mono bg-black/40 backdrop-blur px-2 py-1 rounded border border-[#bc13fe]/30">
                        RENDERER: NIIVUE.GL
                    </div>
                </div>

                <!-- The Actual Canvas -->
                <canvas id="gl"></canvas>
            </div>
        </section>

        <!-- Right Sidebar: Analytics -->
        <aside class="w-[280px] flex flex-col gap-4 shrink-0">
            
            <!-- Damage Report -->
            <div class="glass-panel rounded-2xl p-5 h-1/2 overflow-y-auto">
                <h2 class="text-white font-bold mb-4 text-xs flex items-center gap-2 uppercase tracking-widest">
                    <span class="w-2 h-2 rounded-full bg-[#ff2a2a]"></span>
                    Pathology
                </h2>
                
                <div class="flex items-center justify-center mb-6 relative">
                    <!-- Circular SVG -->
                    <svg class="w-20 h-20 transform -rotate-90">
                        <circle cx="40" cy="40" r="36" stroke="#1e293b" stroke-width="6" fill="transparent"/>
                        <circle cx="40" cy="40" r="36" stroke="#ff2a2a" stroke-width="6" fill="transparent" stroke-dasharray="226" stroke-dashoffset="50" class="drop-shadow-[0_0_8px_rgba(255,42,42,0.6)]"/>
                    </svg>
                    <div class="absolute text-center">
                        <div class="text-xl font-bold text-white">HI</div>
                        <div class="text-[9px] text-gray-400">Risk</div>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="bg-white/5 p-3 rounded-lg border-l-2 border-[#ff9100]">
                        <div class="text-[10px] text-gray-400 uppercase">Region</div>
                        <div class="text-sm font-bold text-white">Corpus Callosum</div>
                        <div class="text-[10px] text-[#ff2a2a] mt-1">FA Value: 0.22 (Anomaly)</div>
                    </div>
                </div>
            </div>

            <!-- FA Histogram -->
            <div class="glass-panel rounded-2xl p-5 flex-1 relative flex flex-col">
                <h2 class="text-gray-300 font-bold mb-2 text-xs uppercase tracking-widest">FA Distribution</h2>
                <div class="flex-1 flex items-end gap-1 pb-4 border-b border-gray-700">
                    <div class="w-1/5 bg-cyan-900/50 h-[20%] rounded-t"></div>
                    <div class="w-1/5 bg-cyan-800/50 h-[50%] rounded-t"></div>
                    <div class="w-1/5 bg-[#ff2a2a] h-[30%] rounded-t shadow-[0_0_10px_red]"></div> <!-- Damaged area -->
                    <div class="w-1/5 bg-cyan-600/50 h-[80%] rounded-t"></div>
                    <div class="w-1/5 bg-cyan-500/50 h-[40%] rounded-t"></div>
                </div>
                
                <button class="mt-auto w-full py-3 bg-gradient-to-r from-[#bc13fe] to-cyan-600 rounded text-xs font-bold uppercase tracking-wider hover:opacity-90 transition shadow-lg cursor-pointer text-white">
                    Generate Report
                </button>
            </div>
        </aside>

    </main>

    <!-- Niivue Logic -->
    <script type="module" async>
        import { Niivue } from "https://unpkg.com/@niivue/niivue@0.57.0/dist/index.js"

        // Setup Volume List (MNI152 Standard Brain)
        var volumeList = [
            { url: "https://niivue.github.io/niivue-demo-images/mni152.nii.gz" }
        ];

        // Initialize Niivue
        // isResizeCanvas: false ensures we can control sizing via CSS flexbox, 
        // though Niivue handles internal resolution scaling.
        var nv = new Niivue({ 
            isResizeCanvas: false,
            backColor: [0, 0, 0, 0], // Transparent background
            show3Dcrosshair: true,
            loadingText: "LOADING FORENSIC DATA...",
        });

        // Attach to the canvas element
        await nv.attachTo("gl");

        // Load the volume
        await nv.loadVolumes(volumeList);

        // Optional: Set defaults for a "Forensic" look
        nv.setSliceType(nv.sliceTypeMultiplanar); // Show 3 planes + 3D
        nv.opts.isColorbar = false; // Hide colorbar for cleaner UI
        await nv.updateGLVolume();
    </script>
</body>
</html>
